[project]
name = "udi-tahoma-pg3x"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "udi-interface",
    "requests>=2.33.0",
    "aiohttp>=3.13.4",
    "pyoverkiz>=1.13.0,<2.0.0",
    "pyasn1>=0.6.2",
    "ecdsa>=0.19.2",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pyright[nodejs]",
    "ruff",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
